version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tmpro
      POSTGRES_PASSWORD: tmpro
      POSTGRES_DB: tmpro
    ports:
      - "5432:5432"
    volumes:
      - tmpro_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  tmpro_pg_data:
